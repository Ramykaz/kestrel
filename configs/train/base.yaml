# Detector training preset for round 0. A T4 runs about 28 s per epoch on 8k frames at 320,
# so 40 epochs finish inside the cap with the learning rate schedule complete.
base_weights: yolo11n-pose.pt
epochs: 40
gpu_minutes: 22
imgsz: 320
batch: 64
freeze: 0
augment:
  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.4
  degrees: 10.0
  translate: 0.1
  scale: 0.5
  fliplr: 0.5
  mosaic: 1.0
